# =========================================================
# COPY this file, rename your copy to "application.properties",
# and place it in: src/main/resources/
#
# application.properties is in .gitignore ON PURPOSE -
# never commit real DB credentials or JWT secrets to GitHub.
# Each teammate keeps their own local copy with their own values.
# =========================================================

# ---- Server ----
server.port=8080

# ---- Database (MySQL) ----
# Local development: point this at your own local MySQL instance
spring.datasource.url=jdbc:mysql://localhost:3306/medishare_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_local_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---- JWT ----
# Use a long random string in your real local file - do not reuse this example value
jwt.secret=replace_this_with_a_long_random_secret_key_min_32_chars
jwt.expiration=86400000

# ---- File upload (for medicine photos / NGO verification docs) ----
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
